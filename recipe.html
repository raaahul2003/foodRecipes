<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>recipe</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <!-- Header-->
        <header class="bg-primary py-3">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Food Recipes</h1>
                    <p class="lead fw-bold text-white-50 mb-0">Al Recipes in one place</p>
                </div>
            </div>
        </header>
        <!-- Section-->
        <section class="py-5">
            <div class="container px-4 px-lg-5 mt-5">
                <div id="output2" class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">
                      
                </div>
            </div>
        </section>
        <!-- Footer-->
        <footer class="py-5 bg-primary">
            <div class="container"><p class="m-0 text-center text-white">Copyright &copy; Your Website 2026</p></div>
        </footer>
</body>
<script>
    const params=new URLSearchParams(window.location.search)
    const id = params.get('id')
    console.log(`id: ${id}`);
    
    fetch('https://dummyjson.com/recipes')
    .then(response => 
    // console.log(response)
        response.json()
    )
    .then(data => {
        let output = document.getElementById('output2')    
        const show = data.recipes.find(a =>  (a.id==id))
        console.log(show.name)  
            output2.innerHTML += `
                        <div class="card mb-3 " style="min-width: 540px;">
                        <div class="row g-0">
                            <div class="col-md-4 d-flex justify-content-center align-items-center">
                            <img src=${show.image} class="img-fluid rounded-start" alt="...">
                            </div>
                            <div class="col-md-8">
                            <div class="card-body">
                                <h3 class="card-title fw-bold">${show.name}</h3>
                                 <p class="card-text"><small class="text-body-secondary"></small><strong>Meal Type: </strong>${show.mealType}</p>
                                <p class="card-text"><strong>Instruction:</strong> ${show.instructions}</p>
                                <p class="card-text"><strong>Ingredients:</strong> ${show.ingredients}</p>
                            </div>
                            </div>
                        </div>
                        </div>`
    })    
    .catch(error => {
            console.log("Error:", error);
        });
</script>
</html>
