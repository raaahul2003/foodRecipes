<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Recipes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        :root {
            --ink: #20352d;
            --herb: #315b46;
            --tomato: #c94e36;
            --paper: #f5f4ed;
            --line: #e4e3da;
        }
        body {
            background: var(--paper);
            color: var(--ink);
            font-family: 'EB Garamond', Georgia, serif;
        }
        .site-header {
            position: relative;
            overflow: hidden;
            padding: 2.25rem 0 2.5rem;
            background: var(--herb);
        }
        .site-header::after {
            position: absolute;
            right: -3rem;
            bottom: -7rem;
            width: 20rem;
            height: 20rem;
            border: 1px solid rgb(255 255 255 / 18%);
            border-radius: 50%;
            content: '';
        }
        .site-header .display-4 {
            position: relative;
            z-index: 1;
            margin-bottom: .25rem;
            font-size: clamp(2.5rem, 7vw, 4.5rem);
            letter-spacing: 0;
        }
        .site-header .lead {
            position: relative;
            z-index: 1;
            color: #e5eee6 !important;
            font-size: 1.15rem;
        }
        .recipe-section {
            min-height: 65vh;
            padding: 2rem 0 4rem;
        }
        #output .col {
            margin-bottom: 1.5rem !important;
        }
        #output .card {
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: #fffefa;
            box-shadow: 0 5px 18px rgb(32 53 45 / 5%);
            transition: transform 180ms ease, box-shadow 180ms ease;
        }
        #output .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgb(32 53 45 / 12%);
        }
        #output .card-img-top {
            width: 100%;
            height: 220px;
            padding: 0 !important;
            object-fit: cover;
            background: #ecebe2;
        }
        #output .card-body {
            padding: 1.1rem 1.2rem .45rem !important;
        }
        #output .card h5 {
            min-height: 3.2rem;
            margin-bottom: .45rem;
            color: var(--ink);
            font-size: 1.45rem;
            line-height: 1.1;
        }
        #output .card p {
            margin-bottom: .5rem;
        }
        #output .card .dif {
            color: #64766a;
            font-family: Arial, sans-serif;
            font-size: .78rem;
            letter-spacing: 0;
        }
        #output .card-footer {
            padding: .65rem 1.2rem 1.1rem !important;
        }
        #output .btn {
            border-color: var(--herb);
            border-radius: 3px;
            color: var(--herb);
            font-family: Arial, sans-serif;
            font-size: .78rem;
            letter-spacing: 0;
            text-transform: uppercase;
        }
        #output .btn:hover {
            border-color: var(--herb);
            background: var(--herb);
            color: white;
        }
        .site-footer {
            padding: 1.25rem 0;
            background: var(--herb);
            font-family: Arial, sans-serif;
            font-size: .8rem;
        }
        @media (max-width: 575.98px) {
            #output.row-cols-2 > * {
                flex: 0 0 100%;
                max-width: 100%;
            }
            #output .card-img-top {
                height: 230px;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            #output .card {
                transition: none;
            }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    
</head>
<body>
        <!-- Header-->
        <header class="site-header">
            <div class="container px-2 px-lg-2 my-3">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder" >Food Recipes</h1>
                    <p class="lead text-light-50 mb-0">All recipes in one place</p>
                </div>
            </div>
        </header>
        <!-- Section-->
        <section class="recipe-section">
            <div class="container px-3 px-lg-2 mt-4">
                <div id="output" class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">
                      
                </div>
            </div>
        </section>
        <!-- Footer-->
        <footer class="site-footer">
            <div class="container"><p class="m-0 text-center text-white fw-bold">Copyright &copy; Your Website 2026</p></div>
        </footer>
<script>
    fetch('https://dummyjson.com/recipes')
    .then(response => 
    // console.log(response)
        response.json()
    )
    .then(data => {
        // console.log(data.recipes);
        let output = document.getElementById('output')
        // data.recipes.forEach(value =>  
        // console.log(value.id))
        // console.log(value)
        
        data.recipes.forEach(a =>  
        // console.log(a.name)  
            output.innerHTML += `
                        <div class="col mb-5">
                        <div class="card h-100">
                            <!-- Product image-->
                            <img class="card-img-top p-2" src="${a.image}" alt="..." />
                            <!-- Product details-->
                            <div class="card-body p-2">
                                <div class="text-center">
                                    <!-- Product name-->
                                    <h5 class="fw-bolder">${a.name}</h5>
                                    <p>${a.rating} <i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i></p>
                                    <p class ="dif fw-bold">Difficulty: ${a.difficulty}</p>
                                </div>
                            </div>
                            <!-- Product actions-->
                            <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                                <div class="text-center"><a class="btn btn-outline-dark mt-auto fw-bold" href="recipe.html?id=${a.id}">View more</a></div>
                            </div>
                        </div>
                    </div>`
          )
    })    
    .catch(error => {
            console.log("Error:", error);
        });

</script>
</body>
</html>
