<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        .card-img-top {
            width: 100%;
            height: 250px;
            object-fit:contain;
        }
    </style>
</head>
<body>
        <!-- Header-->
        <header class="bg-primary py-3">
            <div class="container px-4 px-lg-5 my-5">
                <div class="text-center text-white">
                    <h1 class="display-4 fw-bolder">Food Recipes</h1>
                    <p class="lead fw-bold text-white-50 mb-0">Al Recipes in one place</p>
                </div>
            </div>
        </header>
        <!-- Section-->
        <section class="py-5">
            <div class="container px-4 px-lg-5 mt-5">
                <div id="output" class="row gx-4 gx-lg-5 row-cols-2 row-cols-md-3 row-cols-xl-4 justify-content-center">
                      
                </div>
            </div>
        </section>
        <!-- Footer-->
        <footer class="py-5 bg-primary">
            <div class="container"><p class="m-0 text-center text-white">Copyright &copy; Your Website 2026</p></div>
        </footer>
</body>
<script>
    fetch('https://dummyjson.com/recipes')
    .then(response => 
    // console.log(response)
        response.json()
    )
    .then(data => {
        // console.log(data.recipes);
        let output = document.getElementById('output')
        // data.recipes.forEach(value =>  
        // console.log(value.id))
        // console.log(value)
        
        data.recipes.forEach(a =>  
        // console.log(a.name)  
            output.innerHTML += `
                        <div class="col mb-5">
                        <div class="card h-100">
                            <!-- Product image-->
                            <img class="card-img-top" src="${a.image}" alt="..." />
                            <!-- Product details-->
                            <div class="card-body p-4">
                                <div class="text-center">
                                    <!-- Product name-->
                                    <h5 class="fw-bolder">${a.name}</h5>
                                </div>
                            </div>
                            <!-- Product actions-->
                            <div class="card-footer p-4 pt-0 border-top-0 bg-transparent">
                                <div class="text-center"><a class="btn btn-outline-dark mt-auto" href="recipe.html?id=${a.id}">View more</a></div>
                            </div>
                        </div>
                    </div>`
          )
    })    
    .catch(error => {
            console.log("Error:", error);
        });

</script>
</html>
